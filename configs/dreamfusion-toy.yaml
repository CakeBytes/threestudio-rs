# Toy DreamFusion-style run. Structure follows threestudio's configs/dreamfusion-sd.yaml,
# but uses a mock score-distillation guidance (no diffusion model in Rust yet).
name: "dreamfusion-toy"
tag: "mock-sds"
seed: 0
exp_root_dir: "outputs"

data_type: "random-camera-datamodule"
data:
  width: 32
  height: 32
  batch_size: 1
  elevation_range: [-10, 90]
  azimuth_range: [-180, 180]
  camera_distance_range: [1.0, 1.5]
  fovy_range: [40, 70]
  eval_camera_distance: 1.5
  eval_fovy_deg: 70.0

system_type: "dreamfusion-system"
system:
  geometry_type: "implicit-volume"
  geometry:
    radius: 1.0
    n_frequencies: 6
    n_neurons: 64
    n_hidden_layers: 2
    density_bias: "blob_magic3d"
    density_blob_scale: 10.0
    density_blob_std: 0.5

  renderer_type: "nerf-volume-renderer"
  renderer:
    num_samples_per_ray: 32
    randomized: true
    near: 0.1
    far: 3.0

  background:
    color: [1.0, 1.0, 1.0]

  prompt_processor:
    prompt: "a red ball"

  guidance_type: "mock-sds-guidance"
  guidance:
    min_step_percent: 0.02
    max_step_percent: 0.98
    num_train_timesteps: 1000
    mock_target_color: [1.0, 0.1, 0.1]

  loss:
    lambda_sds: 1.0
    lambda_sparsity: 0.0

  optimizer:
    name: Adam
    lr: 0.01
    betas: [0.9, 0.99]
    eps: 1.0e-15

trainer:
  max_steps: 100
  log_every_n_steps: 10
