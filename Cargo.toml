[workspace]
resolver = "3"
members = ["crates/threestudio", "crates/threestudio-kernels"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/CakeBytes/threestudio-rs"
authors = ["CakeBytes"]

[workspace.dependencies]
burn = { version = "=0.18.0", default-features = false }
cubecl = { version = "=0.6.0", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
rand = "0.9"
